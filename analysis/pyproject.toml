[project]
name = "furlong-analysis"
version = "0.1.0"
description = "DB データの探索的分析・可視化用 Jupyter 環境"
requires-python = ">=3.11"
dependencies = [
    "jupyterlab>=4.0",
    "ipykernel>=6.29",
    "pandas>=2.2",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "python-dotenv>=1.0",
    "furlong-repository",
]

[tool.uv.sources]
furlong-repository = { workspace = true }

[project.optional-dependencies]
dev = [
    "ruff>=0.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["analysis"]

[tool.ruff.lint]
select = ["E", "F", "I"]
