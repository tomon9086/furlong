# 全サービス共通のログ設定。json-file ドライバは既定では無制限に増え続けるため上限を設ける
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    # 本番では DB ポートをホストに公開しない（コンテナ内ネットワークのみ）
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend
    logging: *default-logging

  api:
    build:
      context: .
      dockerfile: predictor/Dockerfile
    restart: always
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./predictor/models:/app/models:ro
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend
    logging: *default-logging

  scraper:
    build:
      context: .
      dockerfile: scraper/Dockerfile
    restart: always
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend
    logging: *default-logging

  backup:
    build:
      context: ./backup
      dockerfile: Dockerfile
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PGHOST: db
      RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-7}
      RETENTION_COUNT: ${BACKUP_RETENTION_COUNT:-3}
    volumes:
      - backup_data:/backup
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend
    logging: *default-logging

networks:
  backend:
    driver: bridge

volumes:
  postgres_data:
  backup_data:
